<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>llmcascade · change password</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --line: #2a3544;
      --text: #d6dde6;
      --muted: #8b97a8;
      --bad: #e05a5a;
      --sans: "IBM Plex Sans", "Source Sans 3", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(900px 500px at 80% 0%, #1a2830 0%, transparent 50%),
        var(--bg);
      padding: 1.5rem;
    }
    form {
      width: min(24rem, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 1.5rem;
      display: grid;
      gap: 0.85rem;
    }
    h1 { margin: 0; font-size: 1.2rem; }
    p { margin: 0; color: var(--muted); font-size: 0.85rem; }
    label { font-size: 0.8rem; color: var(--muted); }
    input {
      width: 100%;
      margin-top: 0.25rem;
      padding: 0.55rem 0.65rem;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: #12181f;
      color: var(--text);
    }
    button {
      margin-top: 0.35rem;
      padding: 0.55rem 0.8rem;
      border-radius: 4px;
      border: 1px solid #3a6ea5;
      background: color-mix(in srgb, #3a6ea5 35%, var(--panel));
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
    }
    .err { color: var(--bad); font-size: 0.85rem; }
  </style>
</head>
<body>
  <form method="post" action="/admin/change-password" id="form">
    <h1>Change password</h1>
    <p>You must set a new password before using the dashboard. Minimum 8 characters.</p>
    <input type="hidden" name="csrf_token" id="csrf_token" value="__CSRF_TOKEN__" />
    <div>
      <label for="new_password">New password</label>
      <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" required />
    </div>
    <div>
      <label for="confirm_password">Confirm password</label>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required />
    </div>
    <div class="err" id="err"></div>
    <button type="submit">Save password</button>
  </form>
  <script>
    document.getElementById("form").addEventListener("submit", (e) => {
      const a = document.getElementById("new_password").value;
      const b = document.getElementById("confirm_password").value;
      if (a !== b) {
        e.preventDefault();
        document.getElementById("err").textContent = "Passwords do not match.";
      }
    });
  </script>
</body>
</html>
