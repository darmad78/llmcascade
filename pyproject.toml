[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmrouter"
version = "0.1.0"
description = "Free-tier LLM dispatcher with live rate-limit budgets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.setuptools.packages.find]
where = ["."]
include = ["llmrouter*"]

[tool.setuptools.package-data]
llmrouter = ["models.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
