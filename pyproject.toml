[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmcascade"
version = "0.1.0"
description = "Free-tier LLM dispatcher with live rate-limit budgets"
readme = "README.md"
license = { text = "BUSL-1.1-derived / source-available" }
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "motor>=3.3", "python-dotenv>=1.0", "cryptography>=42", "PyJWT>=2.8", "bcrypt>=4.1", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["llmcascade*"]

[tool.setuptools.package-data]
llmcascade = ["models.yaml", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
