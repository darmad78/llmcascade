<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>llmrouter · login</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --line: #2a3544;
      --text: #d6dde6;
      --muted: #8b97a8;
      --bad: #e05a5a;
      --sans: "IBM Plex Sans", "Source Sans 3", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(900px 500px at 20% 0%, #1c2a3a 0%, transparent 55%),
        var(--bg);
      padding: 1.5rem;
    }
    form {
      width: min(22rem, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 1.5rem;
      display: grid;
      gap: 0.85rem;
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.25rem; }
    p { margin: 0 0 0.5rem; color: var(--muted); font-size: 0.85rem; }
    label { font-size: 0.8rem; color: var(--muted); }
    input {
      width: 100%;
      margin-top: 0.25rem;
      padding: 0.55rem 0.65rem;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: #12181f;
      color: var(--text);
    }
    button {
      margin-top: 0.35rem;
      padding: 0.55rem 0.8rem;
      border-radius: 4px;
      border: 1px solid #3a6ea5;
      background: color-mix(in srgb, #3a6ea5 35%, var(--panel));
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
    }
    .err { color: var(--bad); font-size: 0.85rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <form method="post" action="/login" id="login-form">
    <h1>llmrouter</h1>
    <p>Sign in to the admin dashboard.</p>
    <div>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required />
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
    </div>
    <div class="err" id="err"></div>
    <button type="submit">Sign in</button>
    <p style="margin:0.4rem 0 0;font-size:0.78rem;color:var(--muted)">
      <a href="/help" style="color:var(--muted)">Help &amp; error catalog</a>
    </p>
  </form>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("error")) {
      document.getElementById("err").textContent = params.get("error");
    }
  </script>
</body>
</html>
