models:
  # Groq free: llama-3.3-70b-versatile — 30 RPM · 12K TPM · 1,000 RPD (org-level).
  - name: llama-3.3-70b-versatile
    provider: groq
    endpoint: https://api.groq.com/openai/v1/chat/completions
    auth_env_var: GROQ_API_KEY
    free_tier_verified: true
    free_tier_note: "Groq free · llama-3.3-70b · 1,000 RPD · 30 RPM · 12K TPM"
    limits:
      rpd: 1000
      rpm: 30
      rps: 1
      tpm: 12000
      max_context: 128000
    capabilities: [chat]
    priority: 10

  # Gemini free Flash family — typical Free ~10 RPM · 1,500 RPD (varies by model/project in AI Studio).
  - name: gemini
    provider: gemini
    endpoint: https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent
    auth_env_var: GOOGLE_API_KEY
    free_tier_verified: true
    free_tier_note: "Gemini Free Flash family · ~1,500 RPD · ~10 RPM (project/model may differ)"
    cascade:
      - gemini-3.6-flash
      - gemini-3.5-flash
      - gemini-3-flash-preview
      - gemini-2.5-flash
      - gemini-2.5-flash-lite
    limits:
      rpd: 1500
      rpm: 10
      rps: 1
      tpm: 250000
      max_context: 1048576
    capabilities: [chat]
    priority: 20

  # OpenRouter free models — account-wide free quota: 20 RPM · 50 RPD (<$10 credits) / 1,000 RPD (≥$10).
  - name: openrouter/free
    provider: openrouter
    endpoint: https://openrouter.ai/api/v1/chat/completions
    auth_env_var: OPENROUTER_API_KEY
    free_tier_verified: true
    free_tier_note: "OpenRouter :free · 50 RPD (1,000 if ≥$10 credits) · 20 RPM"
    limits:
      rpd: 50
      rpm: 20
      rps: 1
      tpm: 100000
      max_context: 128000
    capabilities: [chat]
    priority: 30

  - name: meta-llama/Llama-3.3-70B-Instruct-Turbo-Free
    provider: together
    endpoint: https://api.together.xyz/v1/chat/completions
    auth_env_var: TOGETHER_API_KEY
    free_tier_verified: true
    free_tier_note: "Together free endpoint · Llama-3.3-70B-Instruct-Turbo-Free · reduced RPM"
    limits:
      rpd: 100
      rpm: 10
      rps: 1
      tpm: 60000
      max_context: 8192
    capabilities: [chat]
    priority: 40

  # Cerebras free production: gpt-oss-120b (llama3.1-8b removed from public catalog).
  - name: gpt-oss-120b
    provider: cerebras
    endpoint: https://api.cerebras.ai/v1/chat/completions
    auth_env_var: CEREBRAS_API_KEY
    free_tier_verified: true
    free_tier_note: "Cerebras free · gpt-oss-120b · ~1M TPD · RPM/TPM vary by tier"
    limits:
      rpd: 14400
      rpm: 30
      rps: 1
      tpm: 60000
      max_context: 65536
    capabilities: [chat]
    priority: 50

  - name: mistral-small-latest
    provider: mistral
    endpoint: https://api.mistral.ai/v1/chat/completions
    auth_env_var: MISTRAL_API_KEY
    free_tier_verified: false
    free_tier_note: "Mistral Free mode is workspace-specific — counters unverified"
    limits:
      rpd: 1000
      rpm: 60
      rps: 2
      tpm: 500000
      max_context: 32000
    capabilities: [chat]
    priority: 60

  - name: Meta-Llama-3.3-70B-Instruct
    provider: sambanova
    endpoint: https://api.sambanova.ai/v1/chat/completions
    auth_env_var: SAMBANOVA_API_KEY
    free_tier_verified: false
    free_tier_note: "SambaNova free limits console-only — counters unverified"
    limits:
      rpd: 1000
      rpm: 60
      rps: 2
      tpm: 100000
      max_context: 128000
    capabilities: [chat]
    priority: 70

  - name: deepseek-chat
    provider: deepseek
    endpoint: https://api.deepseek.com/chat/completions
    auth_env_var: DEEPSEEK_API_KEY
    free_tier_verified: false
    free_tier_note: "DeepSeek has no stable free API tier — counters unverified"
    limits:
      rpd: 500
      rpm: 60
      rps: 2
      tpm: 100000
      max_context: 64000
    capabilities: [chat]
    priority: 80

  - name: meta-llama/Meta-Llama-3.1-8B-Instruct
    provider: huggingface
    endpoint: https://router.huggingface.co/v1/chat/completions
    auth_env_var: HF_TOKEN
    free_tier_verified: false
    free_tier_note: "HF free inference is credit-based — counters unverified"
    limits:
      rpd: 200
      rpm: 30
      rps: 1
      tpm: 50000
      max_context: 8192
    capabilities: [chat]
    priority: 90

  - name: "@cf/meta/llama-3.1-8b-instruct"
    provider: cloudflare
    endpoint: https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/run/@cf/meta/llama-3.1-8b-instruct
    auth_env_var: CLOUDFLARE_API_KEY
    free_tier_verified: false
    free_tier_note: "Workers AI uses neurons/day — RPD counter unverified"
    limits:
      rpd: 300
      rpm: 60
      rps: 2
      tpm: 100000
      max_context: 8192
    capabilities: [chat]
    priority: 100

  # Cohere trial/free: commonly 20 RPM; daily/monthly caps vary — treat RPD as soft.
  - name: command-r-08-2024
    provider: cohere
    endpoint: https://api.cohere.com/v2/chat
    auth_env_var: COHERE_API_KEY
    free_tier_verified: true
    free_tier_note: "Cohere trial/free · ~20 RPM (monthly call caps may also apply)"
    limits:
      rpd: 1000
      rpm: 20
      rps: 1
      tpm: 100000
      max_context: 128000
    capabilities: [chat]
    priority: 110

  # NVIDIA NIM free: commonly ~40 RPM, no published RPD — RPD is a soft local gate.
  - name: meta/llama-3.1-8b-instruct
    provider: nvidia
    endpoint: https://integrate.api.nvidia.com/v1/chat/completions
    auth_env_var: NVIDIA_NIM_API_KEY
    free_tier_verified: true
    free_tier_note: "NVIDIA NIM free · ~40 RPM (no published RPD; local RPD is soft)"
    limits:
      rpd: 1000
      rpm: 40
      rps: 1
      tpm: 40000
      max_context: 8192
    capabilities: [chat]
    priority: 120

  - name: meta-llama/Meta-Llama-3.1-8B-Instruct
    provider: deepinfra
    endpoint: https://api.deepinfra.com/v1/openai/chat/completions
    auth_env_var: DEEPINFRA_API_KEY
    free_tier_verified: false
    free_tier_note: "DeepInfra free credits rotate — counters unverified"
    limits:
      rpd: 200
      rpm: 60
      rps: 2
      tpm: 60000
      max_context: 8192
    capabilities: [chat]
    priority: 130
